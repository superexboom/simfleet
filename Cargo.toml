[package]
name = "simfleet"
version = "0.9.0-preview.20"
edition = "2021"
license = "AGPL-3.0-or-later"
authors = ["superexboom"]
repository = "https://github.com/superexboom/simfleet"
readme = "README.md"
description = "A small volunteer compute client for WFSim's board orders and riven gains — runs the engine wfsim.app serves, outside the browser. Unofficial; based on WFSim."

[dependencies]
anyhow = "1"
crossterm = "0.29"
# WFSim's official engine library comes with a manifest signed by WFSim's key
# (docs/CLIENTS.md "The official engine library").
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
getrandom = "0.3"
libloading = "0.8"
# Each thread its own heap: lanes allocating at once never queue on the
# process heap's lock (they did, natively, on Windows).
# Its v2 core: with the v3 core (the crate's default) a client crashed - an
# access violation in mi_heap_main - seconds after taking up simfleet's build
# while it ran on WFSim's library.
mimalloc = { version = "0.1", default-features = false, features = ["v2"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
# `float_roundtrip`: a number read back is the number that was written (the
# engine's own requirement, WFSim Cargo.toml). `preserve_order`: an object keeps
# the key order the engine wrote, as a browser's JSON.parse does.
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
sha2 = "0.10"
toml = "0.9"
unicode-width = "0.2"
# `platform-verifier`: certificates are checked against the system store, as a
# browser checks them (a GitHub accelerator whose root the user installed is
# trusted); the bundled Mozilla roots are the fallback. `win-system-proxy`:
# the proxy Windows is set to, not only HTTPS_PROXY.
ureq = { version = "3", features = ["gzip", "platform-verifier", "win-system-proxy"] }
wasmtime = { version = "49", default-features = false, features = ["cranelift", "runtime", "gc", "gc-drc", "std"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    "Win32_System_JobObjects",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_System_Performance",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
] }

[profile.release]
codegen-units = 1
lto = true
strip = true
opt-level = "s"
