# THE NATIVE ENGINE, published for every engine WFSim's main branch carries.
#
# wfsim.app answers GitHub's runners with a bot challenge, so nothing here asks
# it anything. Every 10 minutes a small Linux job computes the engine id of
# WFSim's main (tools/engine_id.py — the id the site serves is that of the
# source it was built from, its files in the order Linux sorts them: WFSim's
# site is built on its CI's Linux runner) and looks at what release
# `engine-<id>` holds for native-engine/revision. Each revision has distinct
# filenames, so local optimizations can ship without replacing old assets.
# For each platform with a file missing, a job at that
# commit, with WFSim's own
# pinned toolchain:
#
#   1. builds the wasm the way WFSim builds it (the reference),
#   2. blanks Digital Extremes' card text (tools/strip_card_text.py, NOTICE.md)
#      and builds with the local host patches recorded beside the DLL,
#      native-engine/ twice: for any x86-64, and for x86-64-v3 (AVX2; about
#      10% faster, the same bits) — Windows <id>.dll / <id>-v3.dll, Linux
#      lib<id>.so / lib<id>-v3.so — and once for Apple silicon, macOS
#      lib<id>.dylib (aarch64-apple-darwin, whose baseline is the M1's own),
#   3. holds both to the reference wasm on 8 board rows of WFSim's committed
#      board snapshot (`simfleet check-native`).
#
# Then the files that passed and were missing are published to engine-<id>;
# nothing published is ever replaced. A platform whose build does not match
# the wasm publishes nothing, and simfleet computes with the wasm there.
#
# simfleet only uses the id the site actually serves, and checks the build
# against the site's own wasm on a canary row before every use.
#
# WHEN IT RUNS: GitHub drops scheduled runs under load, the hour's first
# minutes most of all — a "*/30" schedule (:00 and :30) once went five hours
# without one while WFSim moved its engine three times. So it runs off those
# minutes, every ten, and a run that built something looks at WFSim's main
# again at its end and starts the next at once if the engine moved meanwhile.
# An engine tried and not published (a build or a check that failed) is tried
# again by the schedule once every three hours at most, at once by hand.
name: native-engine
on:
  schedule:
    - cron: "7-59/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: native-engine
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      engine: ${{ steps.o.outputs.engine }}
      commit: ${{ steps.c.outputs.commit }}
      windows: ${{ steps.c.outputs.windows }}
      linux: ${{ steps.c.outputs.linux }}
      macos: ${{ steps.c.outputs.macos }}
      tried: ${{ steps.c.outputs.tried }}
      revision: ${{ steps.c.outputs.revision }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/requirements-native.txt
      - run: python -m unittest discover -s tools -p test_engine_id.py
      - id: c
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone -q --depth 1 https://github.com/magenie33/wfsim.git wfsim
          commit=$(git -C wfsim rev-parse HEAD)
          engine=$(python3 tools/engine_id.py wfsim | head -1)
          revision=$(tr -d '\r\n' < native-engine/revision)
          [[ "$revision" =~ ^[0-9]+$ ]]
          stem="$engine-sfe$revision"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "WFSim main $commit carries engine $engine"
          assets=$(gh release view "engine-$engine" -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' 2>/dev/null || true)
          missing() { for f in "$@"; do grep -qx "$f" <<< "$assets" || return 0; done; return 1; }
          win=false; lin=false; mac=false
          missing "$stem.dll" "$stem.dll.sha256" "$stem.dll.build.json" "$stem-v3.dll" "$stem-v3.dll.sha256" "$stem-v3.dll.build.json" && win=true
          missing "lib$stem.so" "lib$stem.so.sha256" "lib$stem.so.build.json" "lib$stem-v3.so" "lib$stem-v3.so.sha256" "lib$stem-v3.so.build.json" && lin=true
          missing "lib$stem.dylib" "lib$stem.dylib.sha256" "lib$stem.dylib.build.json" && mac=true
          echo "windows needed: $win, linux needed: $lin, macos needed: $mac"
          echo "windows=$win" >> "$GITHUB_OUTPUT"
          echo "linux=$lin" >> "$GITHUB_OUTPUT"
          echo "macos=$mac" >> "$GITHUB_OUTPUT"
          echo "found=$engine" >> "$GITHUB_OUTPUT"
          echo "tried=tried-$engine-$GITHUB_SHA-$(( $(date -u +%s) / 10800 ))" >> "$GITHUB_OUTPUT"
          if [ "$win" = true ] || [ "$lin" = true ] || [ "$mac" = true ]; then
            echo "commit=$commit" >> "$GITHUB_OUTPUT"
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      # TRIED IN THESE THREE HOURS, by this simfleet: the schedule leaves it.
      - id: t
        if: steps.c.outputs.go == 'true' && github.event_name == 'schedule'
        uses: actions/cache/restore@v4
        with:
          path: tried
          key: ${{ steps.c.outputs.tried }}
          lookup-only: true
      - id: o
        if: steps.c.outputs.go == 'true'
        shell: bash
        env:
          ENGINE: ${{ steps.c.outputs.found }}
          HIT: ${{ steps.t.outputs.cache-hit }}
        run: |
          if [ "$HIT" = true ]; then
            echo "engine $ENGINE was tried in these three hours and is not published; run this workflow by hand to try now"
            exit 0
          fi
          echo "engine=$ENGINE" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.engine != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            runner: windows-latest
            exe: target/release/simfleet.exe
            lib: ""
            ext: dll
            cpus: "baseline v3"
          - os: linux
            # The oldest glibc the runners have, so the library loads on more systems.
            runner: ubuntu-22.04
            exe: target/release/simfleet
            lib: lib
            ext: so
            cpus: "baseline v3"
          - os: macos
            # Apple silicon (arm64). One build: the target's baseline is the
            # M1's own (apple-m1), and every M-series chip runs it.
            runner: macos-14
            exe: target/release/simfleet
            lib: lib
            ext: dylib
            cpus: "baseline"
    runs-on: ${{ matrix.runner }}
    env:
      ENGINE: ${{ needs.check.outputs.engine }}
      COMMIT: ${{ needs.check.outputs.commit }}
      GO: ${{ needs.check.outputs[matrix.os] }}
      CPUS: ${{ matrix.cpus }}
      REVISION: ${{ needs.check.outputs.revision }}
    steps:
      - uses: actions/checkout@v5
        if: env.GO == 'true'
      - uses: actions/setup-python@v6
        if: env.GO == 'true'
        with:
          python-version: '3.12'
      - if: env.GO == 'true'
        run: python -m pip install -r tools/requirements-native.txt
      - uses: dtolnay/rust-toolchain@stable
        if: env.GO == 'true'
      - uses: Swatinem/rust-cache@v2
        if: env.GO == 'true'
      - if: env.GO == 'true'
        run: cargo build --release --locked
      - name: WFSim at the commit, and its toolchain
        if: env.GO == 'true'
        id: w
        shell: bash
        run: |
          git clone -q --depth 60 https://github.com/magenie33/wfsim.git .wfsim-src
          git -C .wfsim-src checkout -q "$COMMIT"
          rust=$(sed -n 's/^rust *= *"\(.*\)"/\1/p' .wfsim-src/mise.toml)
          bindgen=$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/version = |"/, ""); print; exit }' .wfsim-src/Cargo.lock)
          echo "rust=$rust" >> "$GITHUB_OUTPUT"
          echo "bindgen=$bindgen" >> "$GITHUB_OUTPUT"
          echo "WFSim pins rust $rust, wasm-bindgen $bindgen"
          rustup toolchain install "$rust" --profile minimal --target wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        if: env.GO == 'true'
        with:
          tool: wasm-bindgen@${{ steps.w.outputs.bindgen }}
      - name: The reference wasm, built as WFSim builds it
        if: env.GO == 'true'
        shell: bash
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.w.outputs.rust }}
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/wfsim
        run: |
          cd .wfsim-src
          cargo build --release --locked -p wfsim-wasm --target wasm32-unknown-unknown
          wasm-bindgen "$CARGO_TARGET_DIR/wasm32-unknown-unknown/release/wfsim_wasm.wasm" --target no-modules --no-typescript --out-dir ../reference
      - name: The native engine, card text blanked, for each CPU level (x86-64 and x86-64-v3; Apple silicon's one)
        if: env.GO == 'true'
        shell: pwsh
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.w.outputs.rust }}
        run: |
          foreach ($cpu in ($env:CPUS -split ' ' | ForEach-Object { if ($_ -eq 'v3') { 'x86-64-v3' } else { '' } })) {
            ./tools/build-native-engine.ps1 -Strip -Commit $env:COMMIT -Engine $env:ENGINE -Cpu $cpu
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Hold both to the reference wasm on WFSim's committed board
        if: env.GO == 'true'
        shell: bash
        run: |
          for cpu in $CPUS; do
            echo "== $cpu"
            SIMFLEET_CPU=$cpu ${{ matrix.exe }} check-native --engine "$ENGINE" --wasm reference/wfsim_wasm_bg.wasm --boards .wfsim-src/site/board --weapons 1 | tee "check-$cpu.log"
            grep -Eq '^CHECK-NATIVE rows=[1-9][0-9]* skipped=0 riven=same' "check-$cpu.log"
          done
      - name: The files
        if: env.GO == 'true'
        shell: bash
        run: |
          mkdir -p out
          cp check-*.log out/
          for cpu in $CPUS; do
            v=""; [ "$cpu" = v3 ] && v=-v3
            f="${{ matrix.lib }}$ENGINE-sfe$REVISION$v.${{ matrix.ext }}"
            # macOS has shasum, not sha256sum.
            sum() { if command -v sha256sum > /dev/null; then sha256sum "$1"; else shasum -a 256 "$1"; fi; }
            ( cd target/release/engines && sum "$f" | awk -v f="$f" '{print $1"  "f}' > "$f.sha256" && cp "$f" "$f.sha256" "$f.build.json" ../../../out/ )
            tr -d '\r' < "target/release/engines/$ENGINE-sfe$REVISION$v.patches" >> out/patches
          done
      - uses: actions/upload-artifact@v4
        if: env.GO == 'true'
        with:
          name: engine-${{ matrix.os }}
          path: out/
      - name: Marked as tried, passed or not
        if: always() && env.GO == 'true'
        shell: bash
        run: mkdir -p tried && echo "$ENGINE" > tried/engine
      - uses: actions/cache/save@v4
        if: always() && env.GO == 'true'
        continue-on-error: true
        with:
          path: tried
          key: ${{ needs.check.outputs.tried }}

  publish:
    needs: [check, build]
    if: always() && needs.check.outputs.engine != ''
    runs-on: ubuntu-latest
    env:
      ENGINE: ${{ needs.check.outputs.engine }}
      COMMIT: ${{ needs.check.outputs.commit }}
      REVISION: ${{ needs.check.outputs.revision }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: in
      - name: Publish what passed and is missing
        shell: bash
        run: |
          shopt -s nullglob
          files=(in/engine-*/*.dll in/engine-*/*.so in/engine-*/*.dylib)
          if [ ${#files[@]} -eq 0 ]; then echo "no platform passed"; exit 0; fi
          have=$(gh release view "engine-$ENGINE" -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' 2>/dev/null || true)
          up=()
          for f in "${files[@]}"; do
            for asset in "$f" "$f.sha256" "$f.build.json"; do
              grep -qx "$(basename "$asset")" <<< "$have" || up+=("$asset")
            done
          done
          if [ ${#up[@]} -eq 0 ]; then echo "published meanwhile"; exit 0; fi
          patches=$(cat in/engine-*/patches 2>/dev/null | grep . | sort -u | sed 's/.*/`&`/' | paste -sd, - || true)
          run="[this run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
          tree="https://github.com/$GITHUB_REPOSITORY/tree/$GITHUB_SHA"
          sums=""
          for f in "${files[@]}"; do
            grep -qx "$(basename "$f")" <<< "$have" && continue
            sums+="- \`$(basename "$f")\`: \`$(cut -d' ' -f1 "$f.sha256")\`"$'\n'
          done
          via="native-engine/ at simfleet [\`$GITHUB_SHA\`]($tree) (mimalloc as the allocator, as WFSim's own library has it)"
          if [ -n "$patches" ]; then
            via+=", with $patches from [native-engine/patches]($tree/native-engine/patches)"
          fi
          if [ -n "$have" ]; then
            gh release view "engine-$ENGINE" -R "$GITHUB_REPOSITORY" --json body -q .body > notes.md
            printf '\n**Native revision sfe%s**, built by %s from %s, card text blanked and checked against the reference WASM. Build manifests record each patch hash. simfleet 0.8.1 and later prefer these files:\n\n%s' "$REVISION" "$run" "$via" "$sums" >> notes.md
            gh release upload "engine-$ENGINE" "${up[@]}" -R "$GITHUB_REPOSITORY"
            gh release edit "engine-$ENGINE" -R "$GITHUB_REPOSITORY" --notes-file notes.md
            exit 0
          fi
          {
            echo "Native build of WFSim engine **$ENGINE** for simfleet. simfleet downloads it on its own when wfsim.app serves this engine; there is nothing to install."
            echo
            echo "- **Builds.** Native revision \`sfe$REVISION\`: Windows \`$ENGINE-sfe$REVISION.dll\` and Linux \`lib$ENGINE-sfe$REVISION.so\` run on any x86-64, the \`-v3\` ones on x86-64-v3 CPUs (AVX2, FMA, BMI2); macOS \`lib$ENGINE-sfe$REVISION.dylib\` on Apple silicon. simfleet 0.8.1 and later prefer this revision. Each build has a SHA-256 file and a source/patch manifest."
            echo "- **Source.** WFSim commit [\`$COMMIT\`](https://github.com/magenie33/wfsim/tree/$COMMIT) (AGPL-3.0-or-later, by magenie33 and WFSim contributors), through $via. Built by $run."
            echo "- **No card text.** Digital Extremes' card text was blanked from WFSim's \`data/\` before the build ([tools/strip_card_text.py](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/tools/strip_card_text.py)), since WFSim grants nothing for it ([LICENSE-DATA.md](https://github.com/magenie33/wfsim/blob/main/LICENSE-DATA.md)). The engine only displays that text; no score depends on it."
            echo "- **Checked.** Each matched the wasm built from the same commit bit for bit on 8 rows of WFSim's committed board (one weapon, every ruler and mode) (\`simfleet check-native\`), and simfleet checks the one it uses against wfsim.app's own wasm on a canary row before every use."
            echo "- Unofficial; not made or endorsed by WFSim or Digital Extremes. *Warframe* is a trademark of Digital Extremes Ltd."
            echo
            echo "SHA-256:"
            echo
            printf '%s' "$sums"
          } > notes.md
          gh release create "engine-$ENGINE" "${up[@]}" -R "$GITHUB_REPOSITORY" \
            --title "native engine $ENGINE" --notes-file notes.md --latest=false --target "$GITHUB_SHA"
      - uses: actions/checkout@v5
        if: always()
        with:
          path: simfleet
      - uses: actions/setup-python@v6
        if: always()
        with:
          python-version: '3.12'
      - if: always()
        run: python -m pip install -r simfleet/tools/requirements-native.txt
      - name: WFSim's main moved meanwhile? Then the next run now
        if: always()
        shell: bash
        run: |
          git clone -q --depth 1 https://github.com/magenie33/wfsim.git wfsim
          now=$(python3 simfleet/tools/engine_id.py wfsim | head -1)
          if [ "$now" != "$ENGINE" ]; then
            echo "WFSim's main carries engine $now now; running again"
            gh workflow run native-engine.yml -R "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
          else
            echo "WFSim's main still carries $ENGINE"
          fi
