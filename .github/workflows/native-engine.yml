# THE NATIVE ENGINE, published for every engine WFSim's main branch carries.
#
# wfsim.app answers GitHub's runners with a bot challenge, so nothing here asks
# it anything. Every 30 minutes a small Linux job computes the engine id of
# WFSim's main (tools/engine_id.py — the id the site serves is that of the
# source it was built from). For an id with no release `engine-<id>` yet, a
# Windows job at that commit, with WFSim's own pinned toolchain:
#
#   1. builds the wasm the way WFSim builds it (the reference),
#   2. blanks Digital Extremes' card text (tools/strip_card_text.py, NOTICE.md)
#      and builds native-engine/,
#   3. holds the native build to the reference wasm on 32 board rows of WFSim's
#      committed board snapshot (`simfleet check-native`),
#   4. publishes the release engine-<id>.
#
# simfleet only uses the id the site actually serves, and checks the build
# against the site's own wasm on a canary row before every use.
name: native-engine
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: native-engine
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      engine: ${{ steps.c.outputs.engine }}
      commit: ${{ steps.c.outputs.commit }}
    steps:
      - uses: actions/checkout@v5
      - id: c
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone -q --depth 1 https://github.com/magenie33/wfsim.git wfsim
          commit=$(git -C wfsim rev-parse HEAD)
          engine=$(python3 tools/engine_id.py wfsim | head -1)
          echo "WFSim main $commit carries engine $engine"
          if gh release view "engine-$engine" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "already published"; exit 0
          fi
          echo "engine=$engine" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.engine != ''
    runs-on: windows-latest
    env:
      ENGINE: ${{ needs.check.outputs.engine }}
      COMMIT: ${{ needs.check.outputs.commit }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - name: WFSim at the commit, and its toolchain
        id: w
        shell: bash
        run: |
          git clone -q --depth 60 https://github.com/magenie33/wfsim.git .wfsim-src
          git -C .wfsim-src checkout -q "$COMMIT"
          rust=$(sed -n 's/^rust *= *"\(.*\)"/\1/p' .wfsim-src/mise.toml)
          bindgen=$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/version = |"/, ""); print; exit }' .wfsim-src/Cargo.lock)
          echo "rust=$rust" >> "$GITHUB_OUTPUT"
          echo "bindgen=$bindgen" >> "$GITHUB_OUTPUT"
          echo "WFSim pins rust $rust, wasm-bindgen $bindgen"
          rustup toolchain install "$rust" --profile minimal --target wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.w.outputs.bindgen }}
      - name: The reference wasm, built as WFSim builds it
        shell: bash
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.w.outputs.rust }}
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/wfsim
        run: |
          cd .wfsim-src
          cargo build --release --locked -p wfsim-wasm --target wasm32-unknown-unknown
          wasm-bindgen "$CARGO_TARGET_DIR/wasm32-unknown-unknown/release/wfsim_wasm.wasm" --target no-modules --no-typescript --out-dir ../reference
      - name: The native engine, card text blanked
        shell: pwsh
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.w.outputs.rust }}
        run: |
          powershell -ExecutionPolicy Bypass -File tools/build-native-engine.ps1 -Strip -Commit $env:COMMIT -Engine $env:ENGINE
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Hold it to the reference wasm on WFSim's committed board
        shell: bash
        run: |
          target/release/simfleet.exe check-native --engine "$ENGINE" --wasm reference/wfsim_wasm_bg.wasm --boards .wfsim-src/site/board
      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUST: ${{ steps.w.outputs.rust }}
        run: |
          cd target/release/engines
          test -f "$ENGINE.dll"
          if gh release view "engine-$ENGINE" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "published meanwhile"; exit 0; fi
          sha256sum "$ENGINE.dll" | awk -v f="$ENGINE.dll" '{print $1"  "f}' > "$ENGINE.dll.sha256"
          cat > notes.md <<NOTES
          Native build of WFSim engine **$ENGINE** for simfleet (Windows x64). simfleet downloads it on its own when wfsim.app serves this engine; there is nothing to install.

          - **Source.** WFSim commit [\`$COMMIT\`](https://github.com/magenie33/wfsim/tree/$COMMIT) (AGPL-3.0-or-later, by magenie33 and WFSim contributors), through [native-engine/](https://github.com/$GITHUB_REPOSITORY/tree/$GITHUB_SHA/native-engine) at simfleet [\`$GITHUB_SHA\`](https://github.com/$GITHUB_REPOSITORY/tree/$GITHUB_SHA), Rust $RUST. Built by [this run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID).
          - **No card text.** Digital Extremes' card text was blanked from WFSim's \`data/\` before the build ([tools/strip_card_text.py](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/tools/strip_card_text.py)), since WFSim grants nothing for it ([LICENSE-DATA.md](https://github.com/magenie33/wfsim/blob/main/LICENSE-DATA.md)). The engine only displays that text; no score depends on it.
          - **Checked.** It matched the wasm built from the same commit bit for bit on 32 rows of WFSim's committed board (\`simfleet check-native\`), and simfleet checks it against wfsim.app's own wasm on a canary row before every use.
          - Unofficial; not made or endorsed by WFSim or Digital Extremes. *Warframe* is a trademark of Digital Extremes Ltd.

          SHA-256: \`$(cut -d' ' -f1 "$ENGINE.dll.sha256")\`
          NOTES
          sed -i 's/^          //' notes.md
          gh release create "engine-$ENGINE" "$ENGINE.dll" "$ENGINE.dll.sha256" -R "$GITHUB_REPOSITORY" \
            --title "native engine $ENGINE" --notes-file notes.md --latest=false --target "$GITHUB_SHA"
