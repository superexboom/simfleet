# A tag v* builds simfleet from this source on GitHub's Windows, Linux and
# macOS (Apple silicon) runners and attaches all three to that tag's release. The native engine is never
# included: simfleet downloads the published build itself (native-engine.yml).
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            runner: windows-latest
          - os: linux
            # The oldest glibc the runners have, so the binary runs on more systems.
            runner: ubuntu-22.04
          - os: macos
            # Apple silicon (arm64), macOS 14; the binary runs on macOS 11 and later.
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Release checks
        shell: bash
        run: |
          checks="docs/releases/${GITHUB_REF_NAME}.tests"
          if [ -s "$checks" ]; then
            while IFS= read -r check || [ -n "$check" ]; do
              check="${check%$'\r'}"
              [ -z "$check" ] && continue
              cargo test --release --locked "$check" -- --exact
            done < "$checks"
          else
            cargo test --release --locked
          fi
      - shell: pwsh
        run: ./tools/package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: |
            dist/simfleet-*-windows-x64.zip
            dist/simfleet-*-linux-x64.tar.gz
            dist/simfleet-*-macos-arm64.tar.gz

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Download release artifacts with bounded network retries
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3; do
            if gh run download "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY" --pattern 'dist-*' --dir "download-$attempt"; then
              mkdir -p in
              cp download-$attempt/dist-*/* in/
              exit 0
            fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep "$((attempt * 10))"
          done
      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          shopt -s nullglob
          files=(in/simfleet-*-windows-x64.zip in/simfleet-*-linux-x64.tar.gz in/simfleet-*-macos-arm64.tar.gz)
          [ "${#files[@]}" -eq 3 ]
          sums=$(sha256sum "${files[@]}" | awk '{sub(/^in\//, "", $2); print "- `"$2"`: `"$1"`"}')
          {
            echo "simfleet ${tag} — WFSim 志愿计算客户端，单文件，无需安装 Rust 或运行库。"
            echo
            if [ -f "docs/releases/$tag.md" ]; then cat "docs/releases/$tag.md"; echo; fi
            echo "- **Windows x64**（\`*-windows-x64.zip\`）：解压后双击 \`simfleet.exe\`。"
            echo "- **Linux x64**（\`*-linux-x64.tar.gz\`，glibc 2.35 及以上，如 Ubuntu 22.04+、Debian 12+）：\`tar xzf\` 后运行 \`./simfleet/simfleet\`；没有键鼠检测，按「离开电脑时」的核心数计算。"
            echo "- **macOS（Apple 芯片 M1 及以后）**（\`*-macos-arm64.tar.gz\`）：\`tar xzf\` 后在终端运行 \`./simfleet/simfleet\`。没有 Apple 开发者签名，第一次运行前执行一次 \`xattr -dr com.apple.quarantine simfleet\`（或在「系统设置 → 隐私与安全性」里点「仍要打开」）。有键鼠空闲检测和电池检测，计算时不让 Mac 自动睡眠。"
            echo "- 第一次运行会询问是否同意计算和核心预算。引擎在运行时从 wfsim.app 下载（WFSim 官方发布的 wasm），网站更新后自动跟上；有对应的原生引擎时会自动下载并逐位校验后使用。"
            echo
            echo "源码：https://github.com/${GITHUB_REPOSITORY}/tree/${GITHUB_SHA}（AGPL-3.0-or-later）"
            echo "基于 WFSim（https://github.com/magenie33/wfsim ，AGPL-3.0-or-later），非官方项目，与 WFSim、Digital Extremes 无关联。署名与第三方许可见压缩包内 NOTICE.md 与 THIRD-PARTY-LICENSES.md。"
            echo
            echo "SHA-256:"
            echo
            echo "$sums"
          } > notes.md
          flags=()
          if [[ "$tag" == *-* ]]; then flags+=(--prerelease --latest=false); fi
          gh release create "$tag" "${files[@]}" -R "$GITHUB_REPOSITORY" --title "simfleet $tag" --notes-file notes.md "${flags[@]}"
