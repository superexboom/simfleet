# The WFSim engine built natively, as a library simfleet loads for board
# orders. Built by tools/build-native-engine.ps1 against a WFSim checkout in
# ../.wfsim-src whose engine id matches the one wfsim.app serves.
[package]
name = "simfleet-native-engine"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[lib]
crate-type = ["cdylib"]

[dependencies]
wfsim-webapi = { path = "../.wfsim-src/webapi" }
wfsim-optimizer = { path = "../.wfsim-src/optimizer" }
serde_json = { version = "1", features = ["raw_value", "float_roundtrip"] }
# THE LIBRARY'S OWN ALLOCATOR, as WFSim's own native library has it
# (native/Cargo.toml): lanes allocating at once queued on Windows' process heap
# (a live client's lanes were found waiting there half their time). An
# allocator moves no bit of an answer.
mimalloc = { version = "0.1", default-features = false }

[profile.release]
codegen-units = 1
strip = true

[workspace]
