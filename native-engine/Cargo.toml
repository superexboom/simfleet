# The WFSim engine built natively, as a library simfleet loads for board
# orders. Built by tools/build-native-engine.ps1 against a WFSim checkout in
# ../.wfsim-src whose engine id matches the one wfsim.app serves.
[package]
name = "simfleet-native-engine"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[lib]
crate-type = ["cdylib"]

[dependencies]
wfsim-webapi = { path = "../.wfsim-src/webapi" }
# Only with patches/optimizer-one-thread.patch applied (`riven`): see src/lib.rs.
wfsim-optimizer = { path = "../.wfsim-src/optimizer", optional = true }
serde_json = { version = "1", features = ["raw_value", "float_roundtrip"] }

[features]
# A riven gain's search natively (`sfe_optimize`); build-native-engine.ps1
# turns it on when the optimizer patch applied.
riven = ["dep:wfsim-optimizer"]

[profile.release]
codegen-units = 1
strip = true

[workspace]
